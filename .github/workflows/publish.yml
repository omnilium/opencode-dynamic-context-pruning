name: Publish

on:
    push:
        tags:
            - "v*"

concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    validate:
        name: Validate
        runs-on: blacksmith-2vcpu-ubuntu-2404
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Format check
              run: pnpm run format:check

            - name: Type check
              run: pnpm run typecheck

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm run build

    publish:
        name: Stage release on npm
        needs: validate
        # Trusted Publishing and provenance attestations only work on
        # GitHub-hosted runners, so this one job leaves Blacksmith.
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify tag matches package version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
                      echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}." >&2
                      exit 1
                  fi

            - name: Check npm version
              id: package
              run: |
                  NAME=$(node -p "require('./package.json').name")
                  VERSION=$(node -p "require('./package.json').version")
                  echo "name=${NAME}" >> "$GITHUB_OUTPUT"
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

                  if pnpm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
                      echo "published=true" >> "$GITHUB_OUTPUT"
                      echo "${NAME}@${VERSION} is already published."
                  else
                      echo "published=false" >> "$GITHUB_OUTPUT"
                      echo "${NAME}@${VERSION} is not published yet."
                  fi

            - name: Stage release
              if: steps.package.outputs.published == 'false'
              run: |
                  pnpm stage publish --provenance --access public --no-git-checks
                  {
                      echo "### Staged ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}"
                      echo ""
                      echo "The trusted publisher allows staged publishing only, so this version is not live yet."
                      echo "A maintainer must approve it with 2FA: \`npm stage approve <stage-id>\`, or the Staged Packages tab on npmjs.com."
                      echo "List pending versions with \`npm stage list ${{ steps.package.outputs.name }}\`."
                  } >> "$GITHUB_STEP_SUMMARY"
